<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kalkulator Islami - MBM App</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        emerald: {
                            50: '#ecfdf5',
                            100: '#d1fae5',
                            200: '#a7f3d0',
                            300: '#6ee7b7',
                            400: '#34d399',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                            800: '#065f46',
                            900: '#064e3b'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont,
                "Segoe UI", sans-serif;
        }

        .animate-fadeIn {
            animation: fadeIn .35s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .dark-mode {
            background-color: #0f172a;
            color: #f8fafc;
        }
    </style>
</head>

<body class="bg-emerald-50/60 text-slate-900 dark:bg-slate-950 dark:text-slate-100 pb-10 transition-colors duration-300">
    <!-- =====================================================
         HEADER
    ====================================================== -->
<header
    class="relative w-full overflow-hidden
           rounded-b-[3.5rem]
           bg-gradient-to-br from-emerald-700 via-emerald-600 to-emerald-500
           shadow-2xl">

    <div class="max-w-5xl mx-auto px-6 pt-12 pb-12">

        <div class="flex items-center justify-between">

            <!-- BACK -->
            <button
                onclick="history.back()"
                class="w-11 h-11 rounded-2xl
                       bg-white/15
                       border border-white/20
                       backdrop-blur-md
                       flex items-center justify-center
                       active:scale-95 transition-transform">

                <i
                    data-lucide="arrow-left"
                    class="w-5 h-5 text-white">
                </i>

            </button>


            <!-- DARK MODE -->
            <button
                onclick="toggleDarkMode()"
                class="w-11 h-11 rounded-2xl
                       bg-white/15
                       border border-white/20
                       backdrop-blur-md
                       flex items-center justify-center
                       active:scale-95 transition-transform">

                <i
                    id="theme-icon"
                    data-lucide="moon"
                    class="w-5 h-5 text-white">
                </i>

            </button>

        </div>


        <!-- TITLE -->
        <div class="mt-10 text-center">

            <div
                class="mx-auto w-20 h-20 rounded-[2rem]
                       bg-white/15
                       border border-white/20
                       backdrop-blur-md
                       flex items-center justify-center
                       shadow-xl">

                <i
                    data-lucide="calculator"
                    class="w-10 h-10 text-white">
                </i>

            </div>


            <h1
                class="mt-5 text-3xl font-black tracking-tight text-white">

                Kalkulator Islami

            </h1>


            <p
                class="mt-2 text-xs font-medium text-emerald-50">

                Perhitungan Zakat & Waris

            </p>

        </div>

    </div>


    <!-- DECORATION -->
    <div
        class="absolute -right-20 -bottom-24
               w-64 h-64 rounded-full
               bg-white/10
               pointer-events-none">
    </div>

    <div
        class="absolute -left-20 -top-24
               w-56 h-56 rounded-full
               bg-emerald-400/20
               pointer-events-none">
    </div>


    </header>



    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main class="max-w-5xl mx-auto px-5 py-8">


        <!-- INTRO -->
<section class="animate-fadeIn mb-7">

    <div
        class="bg-emerald-700
               dark:bg-emerald-900
               rounded-[2.5rem]
               border border-emerald-600
               shadow-lg p-6">

        <div class="flex items-start gap-4">

            <div
                class="w-12 h-12 shrink-0 rounded-2xl
                       bg-white/15
                       flex items-center justify-center">

                <i
                    data-lucide="info"
                    class="w-6 h-6 text-white">
                </i>

            </div>


            <div>

                <h2
                    class="text-sm font-black text-white">

                    Layanan Kalkulator Islami

                </h2>


                <p
                    class="text-xs text-emerald-100
                           leading-relaxed mt-2">

                    Gunakan layanan ini untuk membantu melakukan
                    perhitungan zakat dan waris berdasarkan data
                    yang Anda masukkan.

                </p>

            </div>

        </div>

    </div>

</section>



        <!-- =====================================================
             PILIH KALKULATOR
        ====================================================== -->

        <section
            id="calculator-selection"
            class="grid grid-cols-1 sm:grid-cols-2 gap-5 animate-fadeIn">


            <!-- ZAKAT -->

  <button
    onclick="openCalculator('zakat')"
    class="w-full text-left
           bg-gradient-to-br from-emerald-600 to-emerald-700
           p-6 rounded-[2.5rem]
           border border-emerald-500
           shadow-lg
           active:scale-[0.98]
           transition-all group">

    <div
        class="w-14 h-14 rounded-2xl
               bg-white/15
               border border-white/10
               flex items-center justify-center
               group-active:scale-95 transition-transform">

        <i
            data-lucide="hand-coins"
            class="w-7 h-7 text-white">
        </i>

    </div>


    <h3
        class="mt-5 text-lg font-black text-white">

        Kalkulator Zakat

    </h3>


    <p
        class="mt-2 text-xs text-emerald-100
               leading-relaxed">

        Bantu menghitung kewajiban zakat
        berdasarkan jenis dan nilai harta.

    </p>


    <div
        class="mt-5 flex items-center gap-2
               text-white
               text-[10px] font-black uppercase
               tracking-wider">

        <span>Mulai</span>

        <i
            data-lucide="arrow-right"
            class="w-4 h-4">
        </i>

    </div>

</button>



            <!-- WARIS -->

  <button
    onclick="openCalculator('waris')"
    class="w-full text-left
           bg-gradient-to-br from-emerald-800 to-emerald-900
           p-6 rounded-[2.5rem]
           border border-emerald-700
           shadow-lg
           active:scale-[0.98]
           transition-all group">

    <div
        class="w-14 h-14 rounded-2xl
               bg-emerald-400/20
               border border-emerald-300/20
               flex items-center justify-center
               group-active:scale-95 transition-transform">

        <i
            data-lucide="scale"
            class="w-7 h-7 text-emerald-200">
        </i>

    </div>


    <h3
        class="mt-5 text-lg font-black text-white">

        Kalkulator Waris

    </h3>


    <p
        class="mt-2 text-xs text-emerald-100
               leading-relaxed">

        Bantu menghitung pembagian harta
        berdasarkan data ahli waris.

    </p>


    <div
        class="mt-5 flex items-center gap-2
               text-emerald-200
               text-[10px] font-black uppercase
               tracking-wider">

        <span>Mulai</span>

        <i
            data-lucide="arrow-right"
            class="w-4 h-4">
        </i>

    </div>

</button>

        </section>



        <!-- =====================================================
             AREA KALKULATOR
        ====================================================== -->

        <section
            id="calculator-area"
            class="mt-7">
        </section>


    </main>



    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer class="max-w-5xl mx-auto px-5 pb-8">

        <div
            class="border-t border-slate-200
                   dark:border-slate-800
                   pt-6 text-center">

            <p
                class="text-[10px] font-black
                       text-slate-400
                       uppercase tracking-widest">

                MBM App

            </p>

            <p
                class="text-[9px] text-slate-400 mt-1">

                Kalkulator Islami

            </p>

        </div>

    </footer>



    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script>

        lucide.createIcons();


        /* =====================================================
           DARK MODE
        ====================================================== */

        function toggleDarkMode() {

            document.documentElement.classList.toggle('dark');

            const icon = document.getElementById('theme-icon');

            if (!icon) return;

            const isDark =
                document.documentElement.classList.contains('dark');

            icon.setAttribute(
                'data-lucide',
                isDark ? 'sun' : 'moon'
            );

            lucide.createIcons();
        }

function openCalculator(type) {
    const area = document.getElementById('calculatorArea');

    if (type === 'zakat') {
        area.innerHTML = `
            <div class="bg-white rounded-[2rem] p-6 shadow-lg border border-emerald-100">
                <div class="flex items-center gap-4 mb-6">
                    <div class="w-14 h-14 rounded-2xl bg-emerald-100 flex items-center justify-center">
                        <i data-lucide="hand-coins" class="w-7 h-7 text-emerald-700"></i>
                    </div>
                    <div>
                        <h3 class="text-lg font-black text-emerald-900">
                            Kalkulator Zakat
                        </h3>
                        <p class="text-xs text-gray-500">
                            Hitung kewajiban zakat Anda
                        </p>
                    </div>
                </div>

                <div class="p-4 rounded-2xl bg-emerald-50 border border-emerald-100">
                    <p class="text-sm text-emerald-800 font-semibold">
                        Modul Zakat akan kita lengkapi setelah modul Waris terhubung.
                    </p>
                </div>
            </div>
        `;
    }

    if (type === 'waris') {
        area.innerHTML = `
            <div class="bg-white rounded-[2rem] p-6 shadow-lg border border-emerald-100">

                <div class="flex items-center gap-4 mb-6">
                    <div class="w-14 h-14 rounded-2xl bg-emerald-100 flex items-center justify-center">
                        <i data-lucide="scale" class="w-7 h-7 text-emerald-700"></i>
                    </div>

                    <div>
                        <h3 class="text-lg font-black text-emerald-900">
                            Kalkulator Waris
                        </h3>
                        <p class="text-xs text-gray-500">
                            Perhitungan pembagian harta warisan
                        </p>
                    </div>
                </div>

                <div class="p-4 rounded-2xl bg-emerald-50 border border-emerald-100 mb-6">
                    <p class="text-xs leading-relaxed text-emerald-800">
                        Masukkan data pewaris, harta peninggalan,
                        serta ahli waris untuk menghitung pembagian
                        warisan.
                    </p>
                </div>

                <div class="space-y-5">

                    <div>
                        <label class="block text-xs font-black text-gray-700 mb-2">
                            Jenis Kelamin Pewaris
                        </label>

                        <select
                            id="warisGender"
                            class="w-full rounded-2xl border border-gray-200 px-4 py-3 text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-emerald-500"
                        >
                            <option value="male">Laki-laki</option>
                            <option value="female">Perempuan</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-black text-gray-700 mb-2">
                            Total Harta Warisan
                        </label>

                        <input
                            id="warisEstate"
                            type="number"
                            min="0"
                            placeholder="Contoh: 100000000"
                            class="w-full rounded-2xl border border-gray-200 px-4 py-3 text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-emerald-500"
                        >
                    </div>

                    <div class="grid grid-cols-2 gap-3">

                        <div>
                            <label class="block text-xs font-black text-gray-700 mb-2">
                                Biaya Pemakaman
                            </label>

                            <input
                                id="warisFuneral"
                                type="number"
                                min="0"
                                value="0"
                                class="w-full rounded-2xl border border-gray-200 px-4 py-3 text-sm"
                            >
                        </div>

                        <div>
                            <label class="block text-xs font-black text-gray-700 mb-2">
                                Hutang
                            </label>

                            <input
                                id="warisDebt"
                                type="number"
                                min="0"
                                value="0"
                                class="w-full rounded-2xl border border-gray-200 px-4 py-3 text-sm"
                            >
                        </div>

                    </div>

                    <div>
                        <label class="block text-xs font-black text-gray-700 mb-2">
                            Wasiat
                        </label>

                        <input
                            id="warisWasiat"
                            type="number"
                            min="0"
                            value="0"
                            class="w-full rounded-2xl border border-gray-200 px-4 py-3 text-sm"
                        >
                    </div>

                    <div class="border-t border-gray-100 pt-5">

                        <h4 class="text-sm font-black text-emerald-900 mb-4">
                            Ahli Waris
                        </h4>

                        <div class="grid grid-cols-2 gap-3">

                            <div>
                                <label class="block text-xs font-bold text-gray-600 mb-2">
                                    Istri
                                </label>

                                <input
                                    id="warisWife"
                                    type="number"
                                    min="0"
                                    max="4"
                                    value="0"
                                    class="w-full rounded-2xl border border-gray-200 px-4 py-3 text-sm"
                                >
                            </div>

                            <div>
                                <label class="block text-xs font-bold text-gray-600 mb-2">
                                    Anak Laki-laki
                                </label>

                                <input
                                    id="warisSons"
                                    type="number"
                                    min="0"
                                    value="0"
                                    class="w-full rounded-2xl border border-gray-200 px-4 py-3 text-sm"
                                >
                            </div>

                            <div>
                                <label class="block text-xs font-bold text-gray-600 mb-2">
                                    Anak Perempuan
                                </label>

                                <input
                                    id="warisDaughters"
                                    type="number"
                                    min="0"
                                    value="0"
                                    class="w-full rounded-2xl border border-gray-200 px-4 py-3 text-sm"
                                >
                            </div>

                        </div>

                        <div class="grid grid-cols-2 gap-3 mt-3">

                            <label class="flex items-center gap-3 p-3 rounded-2xl bg-gray-50">
                                <input
                                    id="warisFather"
                                    type="checkbox"
                                    class="w-5 h-5 accent-emerald-600"
                                >
                                <span class="text-xs font-bold text-gray-700">
                                    Ayah
                                </span>
                            </label>

                            <label class="flex items-center gap-3 p-3 rounded-2xl bg-gray-50">
                                <input
                                    id="warisMother"
                                    type="checkbox"
                                    class="w-5 h-5 accent-emerald-600"
                                >
                                <span class="text-xs font-bold text-gray-700">
                                    Ibu
                                </span>
                            </label>

                        </div>

                    </div>

                    <button
                        onclick="hitungWaris()"
                        class="w-full py-4 rounded-2xl bg-emerald-700 text-white font-black text-sm shadow-lg active:scale-95 transition-transform"
                    >
                        <i data-lucide="calculator" class="w-5 h-5 inline-block mr-2"></i>
                        HITUNG WARIS
                    </button>

                    <div id="warisLoading" class="hidden text-center py-4">
                        <p class="text-sm font-bold text-emerald-700">
                            Menghitung pembagian warisan...
                        </p>
                    </div>

                    <div id="warisError" class="hidden p-4 rounded-2xl bg-red-50 border border-red-100">
                        <p id="warisErrorText" class="text-sm font-semibold text-red-700"></p>
                    </div>

                    <div id="warisResult" class="hidden"></div>

                </div>
            </div>
        `;

        lucide.createIcons();
    }

    area.scrollIntoView({
        behavior: 'smooth',
        block: 'start'
    });
}
const WARIS_API_URL = "https://mbm-waris-api.herisusanto-law.workers.dev";

async function hitungWaris() {
    const loading = document.getElementById('warisLoading');
    const errorBox = document.getElementById('warisError');
    const errorText = document.getElementById('warisErrorText');
    const resultBox = document.getElementById('warisResult');

    errorBox.classList.add('hidden');
    resultBox.classList.add('hidden');
    loading.classList.remove('hidden');

    const gender = document.getElementById('warisGender').value;

    const payload = {
        gender: gender,

        heirs: {
            husband: gender === 'female' ? true : false,

            wife_count: gender === 'male'
                ? Number(document.getElementById('warisWife').value || 0)
                : 0,

            no_spouse:
                Number(document.getElementById('warisWife').value || 0) === 0,

            sons: Number(
                document.getElementById('warisSons').value || 0
            ),

            daughters: Number(
                document.getElementById('warisDaughters').value || 0
            ),

            grandsons: 0,
            granddaughters: 0,

            deceased_sons: 0,
            deceased_daughters: 0,

            father: document.getElementById('warisFather').checked,
            mother: document.getElementById('warisMother').checked,

            grandmother_maternal: false,
            grandmother_paternal: false,
            grandfather_paternal: false,
            grandfather_maternal: false,

            full_brothers: 0,
            full_sisters: 0,

            paternal_brothers: 0,
            paternal_sisters: 0,

            maternal_brothers: 0,
            maternal_sisters: 0,

            nephew_full_brothers: 0,
            nephew_paternal_brothers: 0,

            uncle_paternal: false,
            uncle_paternal_half: false,

            cousin_full_uncles: 0,
            cousin_paternal_half_uncles: 0
        },

        gross_estate: Number(
            document.getElementById('warisEstate').value || 0
        ),

        deductions: {
            funeral_expenses: Number(
                document.getElementById('warisFuneral').value || 0
            ),

            debts: Number(
                document.getElementById('warisDebt').value || 0
            ),

            wasiat: Number(
                document.getElementById('warisWasiat').value || 0
            )
        }
    };

    try {
        const response = await fetch(WARIS_API_URL, {
            method: 'POST',

            headers: {
                'Content-Type': 'application/json'
            },

            body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.error ||
                data.message ||
                'Gagal menghitung warisan.'
            );
        }

        console.log('HASIL API WARIS:', data);

        tampilkanHasilWaris(data);

    } catch (error) {

        console.error('WARIS ERROR:', error);

        errorText.textContent =
            error.message ||
            'Terjadi kesalahan saat menghubungi server.';

        errorBox.classList.remove('hidden');

    } finally {
        loading.classList.add('hidden');
    }
}
    </script>

</body>
</html>
