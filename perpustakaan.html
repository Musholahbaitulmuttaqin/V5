function pilihKlasifikasi(kategori) {

    const perpustakaan = document.getElementById(
        'perpustakaan-modal'
    );

    if (kategori === 'alquran') {

        if (perpustakaan) {
            perpustakaan.classList.add(
                'invisible',
                'opacity-0'
            );
        }

        document.body.style.overflow = 'hidden';

        history.pushState(
            { halaman: 'alquran' },
            '',
            window.location.href
        );

        bukaHalamanAlQuran();
        return;
    }

    if (kategori === 'hadis') {

        if (perpustakaan) {
            perpustakaan.classList.add(
                'invisible',
                'opacity-0'
            );
        }

        document.body.style.overflow = 'hidden';

        history.pushState(
            { halaman: 'hadis' },
            '',
            window.location.href
        );

        bukaHalamanHadis();
        return;
    }

    alert('Kategori: ' + kategori);
}

async function muatDaftarSurah() {

    const container = document.getElementById('daftar-surah');

    if (!container) return;

    container.innerHTML = `
        <div class="text-center py-10">
            <div class="inline-block w-7 h-7 border-4 border-emerald-500 border-t-transparent rounded-full animate-spin"></div>

            <p class="text-white/50 text-xs mt-3">
                Memuat daftar surat...
            </p>
        </div>
    `;

    try {

        const response = await fetch(
    'https://api.myquran.com/v3/quran',
    {
        headers: {
            'Accept': 'application/json'
        }
    }
);

if (!response.ok) {
    throw new Error('Gagal mengambil daftar surat');
}

const result = await response.json();

if (!result.status || !Array.isArray(result.data)) {
    throw new Error(
        result.message || 'Data surat tidak ditemukan'
    );
}

const hasil = result.data;

daftarSuratQuran = hasil;

container.innerHTML = hasil.map(function (surah) {

    const audioUrl = surah.audio_url || '';

    return `
        <div
            class="relative w-full bg-white rounded-3xl p-5 mb-4 shadow-lg overflow-hidden">

            <!-- Ornamen -->
            <div class="absolute -top-8 -left-8 w-20 h-20 border-2 border-emerald-100 rotate-45 opacity-70"></div>

            <div class="absolute -bottom-8 -right-8 w-20 h-20 border-2 border-emerald-100 rotate-45 opacity-70"></div>

            <!-- Informasi Surat -->
            <div class="relative flex items-center gap-4">

                <!-- Nomor -->
                <div
                    class="w-11 h-11 rounded-xl bg-emerald-50 text-emerald-700
                           flex items-center justify-center font-black text-sm shrink-0">
                    ${surah.number}
                </div>

                <!-- Nama -->
                <div
                    class="flex-1 min-w-0 cursor-pointer"
                    onclick="bukaDetailSurah(${surah.number})">

                    <h3 class="text-slate-800 font-black text-base">
                        ${surah.name_latin}
                    </h3>

                    <p class="text-slate-400 text-[10px] font-bold mt-1">
                        ${surah.translation}
                    </p>

                    <div class="flex items-center gap-2 mt-2">

                        <span
                            class="text-[9px] font-black uppercase tracking-wider text-emerald-600">
                            ${surah.number_of_ayahs} Ayat
                        </span>

                        <span class="text-slate-300">•</span>

                        <span
                            class="text-[9px] font-black uppercase tracking-wider text-slate-400">
                            ${surah.revelation}
                        </span>

                    </div>
                </div>

                <!-- Tombol Detail -->
                <button
                    type="button"
                    onclick="bukaDetailSurah(${surah.number})"
                    class="w-10 h-10 rounded-xl bg-slate-50
                           flex items-center justify-center shrink-0">

                    <i
                        data-lucide="chevron-right"
                        class="w-5 h-5 text-slate-400">
                    </i>

                </button>

            </div>

            
        </div>
    `;

}).join('');
        lucide.createIcons();
kontrolAudioSurah();

    } catch (error) {

        console.error(
            'Gagal memuat daftar surat:',
            error
        );

        container.innerHTML = `
            <div class="text-center py-10">

                <i
                    data-lucide="wifi-off"
                    class="w-8 h-8 text-white/40 mx-auto">
                </i>

                <p class="text-white/60 text-sm mt-3">
                    Gagal memuat daftar surat
                </p>

                <button
                    type="button"
                    onclick="muatDaftarSurah()"
                    class="mt-4 px-5 py-3 rounded-xl bg-emerald-600 text-white text-xs font-black">
                    Coba Lagi
                </button>

            </div>
        `;

        lucide.createIcons();
    }
}
function kontrolAudioSurah() {
    const semuaAudio = document.querySelectorAll(
        '#daftar-surah audio'
    );

    semuaAudio.forEach(function (audio) {

        audio.addEventListener('play', function () {

            semuaAudio.forEach(function (audioLain) {

                if (audioLain !== audio) {
                    audioLain.pause();
                    audioLain.currentTime = 0;
                }

            });

        });

    });
}
function cariSuratQuran(keyword) {

    const rekomendasi = document.getElementById('rekomendasi-surah');

    if (!rekomendasi) return;

    keyword = keyword.trim().toLowerCase();

    if (!keyword) {
        rekomendasi.innerHTML = '';
        return;
    }

    const hasil = daftarSuratQuran.filter(function (surah) {

        return (
            String(surah.number) === keyword ||
            surah.name_latin.toLowerCase().includes(keyword) ||
            surah.translation.toLowerCase().includes(keyword)
        );

    }).slice(0, 6);

    if (!hasil.length) {
        rekomendasi.innerHTML = `
            <div class="bg-white rounded-2xl p-4 text-sm text-slate-400 font-bold">
                Surat tidak ditemukan
            </div>
        `;
        return;
    }

    rekomendasi.innerHTML = hasil.map(function (surah) {

        return `
            <button
                type="button"
                onclick="bukaDetailSurah(${surah.number})"
                class="w-full text-left bg-white rounded-2xl p-4 shadow-sm flex items-center gap-3 active:scale-[0.98] transition">

                <div class="w-10 h-10 rounded-xl bg-emerald-50 text-emerald-700 flex items-center justify-center font-black text-sm">
                    ${surah.number}
                </div>

                <div class="flex-1">
                    <div class="text-slate-800 font-black text-sm">
                        ${surah.name_latin}
                    </div>

                    <div class="text-slate-400 text-xs mt-1">
                        ${surah.translation} • ${surah.number_of_ayahs} Ayat
                    </div>
                </div>

                <i
                    data-lucide="chevron-right"
                    class="w-5 h-5 text-slate-400">
                </i>

            </button>
        `;

    }).join('');

    lucide.createIcons();
}

function formatWaktuMurotal(detik) {
    if (!isFinite(detik)) {
        return '00:00';

    const menit = Math.floor(detik / 60);

           String(detikSisa).padStart(2, '0');

// ===============================
// CACHE AL-QUR'AN 30 HARI
// ===============================

const CACHE_ALQURAN_MS = 30 * 24 * 60 * 60 * 1000;

function ambilCacheAlQuran(kunci) {
    try {
        const raw = localStorage.getItem(kunci);

        if (!raw) return null;

        const cache = JSON.parse(raw);

        if (!cache || !cache.waktu || !cache.data) {
            localStorage.removeItem(kunci);
            return null;
        }

        // Cache sudah lebih dari 30 hari
        if (Date.now() - cache.waktu >= CACHE_ALQURAN_MS) {
            localStorage.removeItem(kunci);
            return null;
        }

        return cache.data;

    } catch (error) {
        console.warn('Cache Al-Qur’an tidak dapat dibaca:', error);
        return null;
    }
}

function simpanCacheAlQuran(kunci, data) {
    try {
        localStorage.setItem(
            kunci,
            JSON.stringify({
                waktu: Date.now(),
                data: data
            })
        );

    } catch (error) {
        // Kalau storage penuh, website tetap berjalan normal
        console.warn('Cache Al-Qur’an tidak dapat disimpan:', error);
    }
}

function cariAyatSurat() {
    const container = document.getElementById('isi-detail-surah');

    if (!container) return;

    const nomorAyat = prompt('Masukkan nomor ayat:');

    if (nomorAyat === null) return;

    const nomor = parseInt(nomorAyat.trim(), 10);

    if (!nomor || nomor < 1) {
        alert('Nomor ayat tidak valid.');
        return;
    }

    const target = document.getElementById('ayat-' + nomor);

    if (!target) {
        alert('Ayat ' + nomor + ' tidak ditemukan dalam surat ini.');
        return;
    }

    const posisi =
    target.offsetTop -
    (container.clientHeight / 2) +
    (target.offsetHeight / 2);

    container.scrollTo({
        top: posisi,
        behavior: 'smooth'
    });

    target.classList.add(
        'bg-emerald-50',
        'rounded-2xl',
        'px-3',
        'py-3'
    );

    setTimeout(function() {
        target.classList.remove(
            'bg-emerald-50',
            'rounded-2xl',
            'px-3',
            'py-3'
        );
    }, 1800);
}


let autoScrollSuratAktif = false;
let autoScrollSuratTimer = null;


function toggleAutoScrollSurat() {
    const container = document.getElementById('isi-detail-surah');
    const tombol = document.getElementById('tombol-auto-scroll');

    if (!container || !tombol) return;

    if (autoScrollSuratAktif) {

        autoScrollSuratAktif = false;

        clearInterval(autoScrollSuratTimer);
        autoScrollSuratTimer = null;

        tombol.innerHTML =
    '<i data-lucide="chevrons-down" class="w-4 h-4"></i>';
        lucide.createIcons();

        return;
    }

    autoScrollSuratAktif = true;

    tombol.innerHTML =
        '<i data-lucide="pause" class="w-4 h-4 fill-current"></i>';

    lucide.createIcons();

    autoScrollSuratTimer = setInterval(function() {

        if (!autoScrollSuratAktif) return;

        const posisiMaksimal =
            container.scrollHeight - container.clientHeight;

        if (container.scrollTop >= posisiMaksimal - 2) {

            autoScrollSuratAktif = false;

            clearInterval(autoScrollSuratTimer);
            autoScrollSuratTimer = null;

            tombol.innerHTML =
                '<i data-lucide="play" class="w-4 h-4 fill-current"></i>';

            lucide.createIcons();

            return;
        }

        container.scrollTop += 1;

    }, 80);
}

async function pilihJenisTafsir(nomorAyat, jenis) {

    const isi = document.getElementById(
        'isi-tafsir-' + nomorAyat
    );

    if (!isi) return;

    const data = window.dataTafsirAyat?.[nomorAyat];

    if (!data) {
        isi.textContent = 'Tafsir tidak tersedia.';
        return;
    }

    // Tombol
    const tombolShort = document.getElementById(
        'tafsir-short-' + nomorAyat
    );

    const tombolLong = document.getElementById(
        'tafsir-long-' + nomorAyat
    );

    // Reset warna kedua tombol
    if (tombolShort) {
        tombolShort.classList.remove(
            'bg-amber-200',
            'text-amber-800'
        );

        tombolShort.classList.add(
            'bg-slate-100',
            'text-slate-600'
        );
    }

    if (tombolLong) {
        tombolLong.classList.remove(
            'bg-amber-200',
            'text-amber-800'
        );

        tombolLong.classList.add(
            'bg-slate-100',
            'text-slate-600'
        );
    }

    // =========================
    // TAFSIR SINGKAT
    // =========================
    if (jenis === 'short') {

        if (tombolShort) {
            tombolShort.classList.remove(
                'bg-slate-100',
                'text-slate-600'
            );

            tombolShort.classList.add(
                'bg-amber-200',
                'text-amber-800'
            );
        }

        isi.textContent =
            data.short || 'Tafsir singkat tidak tersedia.';

        return;
    }

    // =========================
    // TAFSIR LENGKAP
    // =========================

    if (tombolLong) {
        tombolLong.classList.remove(
            'bg-slate-100',
            'text-slate-600'
        );

        tombolLong.classList.add(
            'bg-amber-200',
            'text-amber-800'
        );
    }

    // Simpan teks sebelumnya
const teksSebelumnya = isi.textContent;
    try {

        const response = await fetch(
            'https://api.myquran.com/v3/quran/' +
            data.surah +
            '/' +
            nomorAyat,
            {
                headers: {
                    'Accept': 'application/json'
                }
            }
        );

        const result = await response.json();

        if (
            !response.ok ||
            !result.status ||
            !result.data
        ) {
            throw new Error(
                result.message || 'Tafsir lengkap tidak ditemukan'
            );
        }

        const tafsirLengkap =
            result.data.tafsir?.kemenag?.long || '';

        isi.textContent =
            tafsirLengkap ||
            data.short ||
            'Tafsir lengkap tidak tersedia.';

    } catch (error) {

        console.error(
            'Gagal memuat tafsir lengkap:',
            error
        );

        isi.textContent =
    teksSebelumnya ||
    data.short ||
    'Tafsir lengkap tidak tersedia.';


    }
}
function putarAudioSurah(nomor, audioUrl) {

    let audio = document.getElementById('audio-surah-' + nomor);

    if (!audio) {

        audio = document.createElement('audio');

        audio.id = 'audio-surah-' + nomor;
        audio.src = audioUrl;
        audio.preload = 'none';

        document.body.appendChild(audio);
    }

    if (audio.paused) {
        audio.play();
    } else {
        audio.pause();
    }
}
function putarAudioAyat(nomorAyat) {
    const audio = document.getElementById('audio-ayat-' + nomorAyat);
    const tombol = document.getElementById('tombol-audio-' + nomorAyat);

    if (!audio || !tombol) return;

    if (audio.paused) {
        audio.play();
        tombol.innerHTML = `
            <i data-lucide="pause" class="w-4 h-4 fill-current"></i>
        `;
    } else {
        audio.pause();
        tombol.innerHTML = `
            <i data-lucide="play" class="w-4 h-4 fill-current"></i>
        `;
    }

    lucide.createIcons();
}

function ubahModeBacaan(mode) {

    const terjemahan = document.querySelectorAll('.terjemahan-ayat');

    const tombolArab = document.querySelector(
        'button[onclick="ubahModeBacaan(\'arab\')"]'
    );

    const tombolLengkap = document.querySelector(
        'button[onclick="ubahModeBacaan(\'lengkap\')"]'
    );

    if (mode === 'arab') {

        // Sembunyikan arti
        terjemahan.forEach(function(el) {
            el.classList.add('hidden');
        });

        // Arab Saja = hijau
        tombolArab.classList.remove(
            'bg-slate-100',
            'text-slate-700'
        );

        tombolArab.classList.add(
            'bg-emerald-600',
            'text-white'
        );

        // Arab + Arti = abu-abu
        tombolLengkap.classList.remove(
            'bg-emerald-600',
            'text-white'
        );

        tombolLengkap.classList.add(
            'bg-slate-100',
            'text-slate-700'
        );

    } else {

        // Tampilkan arti
        terjemahan.forEach(function(el) {
            el.classList.remove('hidden');
        });

        // Arab + Arti = hijau
        tombolLengkap.classList.remove(
            'bg-slate-100',
            'text-slate-700'
        );

        tombolLengkap.classList.add(
            'bg-emerald-600',
            'text-white'
        );

        // Arab Saja = abu-abu
        tombolArab.classList.remove(
            'bg-emerald-600',
            'text-white'
        );

        tombolArab.classList.add(
            'bg-slate-100',
            'text-slate-700'
        );

    }

}

        lucide.createIcons();

pagination.className =

container.appendChild(pagination);

}
let timerPencarianHadis = null;

async function cariHadis(keyword) {

    const container = document.getElementById('daftar-hadis');

    if (!container) return;

    keyword = keyword.trim();

    // Jika kosong, kembali ke daftar awal
    if (!keyword) {
        muatDaftarHadis();
        return;
    }

    // API membutuhkan minimal 4 karakter
    if (keyword.length < 4) {
        container.innerHTML = `
            <div class="bg-white rounded-2xl p-6 text-center">
                <i
                    data-lucide="search"
                    class="w-7 h-7 mx-auto text-slate-300 mb-3">
                </i>

                <p class="text-sm font-black text-slate-700">
                    Masukkan minimal 4 karakter
                </p>

                <p class="text-xs text-slate-400 mt-1">
                    Contoh: kiamat, sabar, sholat
                </p>
            </div>
        `;

        lucide.createIcons();
        return;
    }

    container.innerHTML = `
        <div class="text-center py-10">
            <div class="inline-block w-7 h-7 border-4 border-emerald-500 border-t-transparent rounded-full animate-spin"></div>

            <p class="text-white/50 text-xs mt-3">
                Mencari hadis...
            </p>
        </div>
    `;

    try {

        const url =
            'https://api.myquran.com/v3/hadis/enc/cari/' +
            encodeURIComponent(keyword) +
            '?page=1&limit=10';

        const response = await fetch(url, {
            headers: {
                'Accept': 'application/json'
            }
        });

        const result = await response.json();

        if (!response.ok || !result.status) {
            throw new Error(
                result.message || 'Pencarian hadis gagal'
            );
        }

        const hadis = result.data?.hadis || [];

        if (hadis.length === 0) {

            container.innerHTML = `
                <div class="bg-white rounded-2xl p-6 text-center">

                    <i
                        data-lucide="search-x"
                        class="w-8 h-8 mx-auto text-slate-300 mb-3">
                    </i>

                    <p class="text-sm font-black text-slate-700">
                        Hadis tidak ditemukan
                    </p>

                    <p class="text-xs text-slate-400 mt-1">
                        Coba gunakan kata kunci lain.
                    </p>

                </div>
            `;

            lucide.createIcons();
            return;
        }

        container.innerHTML = `
            <div class="mb-2 px-1">
                <p class="text-white/50 text-[10px] font-black uppercase tracking-wider">
                    Hasil pencarian: ${keyword}
                </p>
            </div>

            ${hadis.map(h => `

                <button
                    onclick="bukaDetailHadis(${h.id})"
                    class="w-full text-left bg-white rounded-2xl p-5 shadow-lg active:scale-[0.98] transition">

                    <div class="flex items-start gap-3">

                        <div class="flex-1 min-w-0">

                            <div class="text-[10px] font-black text-emerald-600 uppercase tracking-wider">
                                HADIS #${h.id}
                            </div>

                            <p class="mt-3 text-sm leading-7 text-slate-700">
                                ${h.text || ''}
                            </p>

                            ${
                                h.focus && h.focus.length
                                ? `
                                    <div class="mt-3 pt-3 border-t border-slate-100">

                                        <div class="text-[9px] font-black text-slate-400 uppercase mb-1">
                                            Bagian yang cocok
                                        </div>

                                        <p class="text-xs leading-6 text-slate-500">
                                            ${h.focus[0]}
                                        </p>

                                    </div>
                                `
                                : ''
                            }

                        </div>

                        <i
                            data-lucide="chevron-right"
                            class="w-5 h-5 text-slate-400 shrink-0 mt-1">
                        </i>

                    </div>

                </button>

            `).join('')}
        `;

        lucide.createIcons();

    } catch (error) {

        console.error('Pencarian hadis:', error);

        container.innerHTML = `
            <div class="bg-red-50 rounded-2xl p-6 text-center">

                <i
                    data-lucide="wifi-off"
                    class="w-8 h-8 mx-auto text-red-500 mb-3">
                </i>

                <p class="text-sm font-black text-red-600">
                    Pencarian gagal
                </p>

                <p class="text-xs text-red-400 mt-2">
                    ${error.message || 'Terjadi kesalahan.'}
                </p>

                <button
                    onclick="cariHadis('${keyword.replace(/'/g, "\\'")}')"
                    class="mt-4 px-5 py-2.5 bg-red-500 text-white rounded-xl text-xs font-black">
                    Coba Lagi
                </button>

            </div>
        `;

        lucide.createIcons();
    }
}
document.addEventListener('DOMContentLoaded', function () {

    const input = document.getElementById('pencarian-hadis');

    if (!input) return;

    input.addEventListener('input', function () {

        clearTimeout(timerPencarianHadis);

        const keyword = this.value;

        timerPencarianHadis = setTimeout(function () {
            cariHadis(keyword);
        }, 600);

    });

});

        });
